# ─────────────────────────────────────────────────────────────
#  Discord Message Categorizer — Configuration
#  Edit this file to define your channels and categories.
#  No code changes needed!
# ─────────────────────────────────────────────────────────────

# ── Channels to collect from ──────────────────────────────────
# Bot scans ALL of these; only messages matching query_detection are saved to disk.
channel_names:
  # A section (category) name means every channel in it. The GAB sections use the same
  # channel names (support, project-related-queries), so they are listed by section; the
  # export's "section" column tells them apart. A * matches any run of characters, so
  # "GAB Phase*" covers every phase's sections ("GAB Phase 7 Conversation QC", "GAB Phase 8 ...")
  # with no edit when a new phase starts.
  - GAB Phase*
  - project-gab-queries
  - general
  - announcements
  - coders-maitrix
  - maitrix-non-coders
  - maitrix-QC
  - maitrix-non-coders-QC
  - 

# ── FAQ channel (output only) ─────────────────────────────────
# /export may only be run here; the CSV is posted here. Does NOT need to be
# in channel_names unless you also want messages from FAQ collected.
faq_channel_name: "faqs"

# ── Historical backfill ───────────────────────────────────────
# If false, the bot does NOT scan channel history on startup — only /export
# fetches past messages from Discord. Live new messages still persist if queries.
auto_backfill_on_startup: false

# When auto_backfill_on_startup is true: max past messages per channel on startup.
# Set to 0 to skip backfill even when auto_backfill is true.
history_limit: 1000

# Max messages fetched per /export (safety cap for very busy channels).
export_max_messages: 50000

# How many unique (by normalized text) recent queries to show before the CSV.
export_top_n: 10

# What counts as a "query" for disk storage, live capture, and /export.
query_detection:
  question_mark_counts: true
  phrases:
    - how do
    - how to
    - what is
    - what are
    - can someone
    - can anyone
    - is there a
    - does anyone
    - help
    - please help
    - stuck
    - anyone know
    - could you
    - where can i
    - why is

# ── Categories ────────────────────────────────────────────────
# Define your own categories below.
# Each category has:
#   name        – label used in output files
#   keywords    – words/phrases that trigger this category
#                 (case-insensitive, partial match)
#   description – human-readable hint (used in logs/summary)
#
# The bot checks keywords IN ORDER and assigns the FIRST match.
# If no keyword matches, the message falls into the last
# category whose name contains "other" / "misc" (case-insensitive),
# or literally the last category in the list.

categories:
  - name: Payment related
    description: "Payments, billing, invoices, refunds"
    keywords:
      - payment
      - pay
      - paid
      - invoice
      - billing
      - refund
      - charge
      - subscription
      - payout
      - stripe
      - paypal
      - wire transfer
      - escrow

  - name: Tasks
    description: "Work items, deadlines, deliverables"
    keywords:
      - task
      - tasks
      - todo
      - deadline
      - deliverable
      - assignment
      - milestone
      - sprint
      - ticket
      - scope of work
      - project


  - name: verify yourself
    description: "Identity verification, KYC, onboarding checks"
    keywords:
      - verify
      - verification
      - identity
      - proof of identity
      - documents
      - onboarding

  - name: General questions
    description: "Catch-all for anything that does not match above"
    keywords: []   # leave empty — fallback bucket


# ══════════════════════════════════════════════════════════════
#  Content Moderation
# ══════════════════════════════════════════════════════════════
# Scans ALL channels for foul language and aggressive behaviour.
# Each tier has a severity score; total score determines action.

moderation:
  enabled: true
  alert_channel_name: "mod-alerts"

  # Score thresholds — what happens at each level
  # Score 1-2: completely ignored (no action, no log, no alert)
  thresholds:
    warn_alert: 3      # score 3-4: alert embed in #mod-alerts (no deletion)
    critical_alert: 5  # score 5+:  alert with @here ping + auto-delete if guardrails pass

  # ── Auto-deletion guardrails ───────────────────────────────
  # Messages are ONLY auto-deleted when ALL guardrails pass.
  # This prevents accidental removal of borderline / innocent messages.
  auto_delete:
    enabled: true
    min_score: 5                # must score at least this to consider deletion
    min_reasons: 2              # must trigger at least 2 different detection reasons
    min_word_count: 1           # no minimum — even single-word profanity gets deleted
    require_keyword_tier: true  # at least one keyword tier (not just behavioural signals) must fire
    # Tiers strong enough to allow deletion on their own (bypass score threshold).
    # These only need to match + pass min_word_count to trigger deletion.
    solo_delete_tiers:
      - threats_and_violence
      - profanity
      - hinglish
    # Channels where auto-delete is disabled (still alerts, just no deletion)
    exempt_channels: []
    #  - announcements
    #  - general

  # ── Periodic audit ─────────────────────────────────────────
  audit:
    enabled: true
    interval_minutes: 30        # how often the audit runs
    lookback_minutes: 35        # how far back to scan (slight overlap to avoid gaps)
    max_messages_per_channel: 500

  # Behavioural signals (not keyword-based)
  aggression_signals:
    caps_ratio: 0.70            # flag if >70% uppercase (min 8 chars)
    caps_score: 2
    excessive_punctuation: 3    # flag if 3+ consecutive !!! or ???
    excessive_punctuation_score: 1
    repeated_chars: 5           # flag if same char repeated 5+ times (e.g. "nooooo")
    repeated_chars_score: 1

  # ── Keyword tiers ──────────────────────────────────────────
  # score: added per match; a message can match multiple tiers

  mild_aggression:
    score: 1
    words:
      - annoying
      - nonsense
      - what a joke
      - cope
      - damn
      - hell
      - crap
      - bloody
      - sucks

  profanity:
    score: 3
    words:
      - idiot
      - moron
      - stupid
      - dumb
      - loser
      - clown
      - trash
      - garbage
      - pathetic
      - worthless
      - useless
      - go away
      - get lost
      - nobody asked
      - cry about it
      - skill issue
      - you suck
      - hate you
      - i hate you
      - disgusting
      - creep
      - freak
      - psycho
      - lunatic
      - get a life
      - touch grass
      - are you dumb
      - are you stupid
      - learn to read
      - use your brain
      - no one cares
      - who asked
      - jerk
      - shut up
      - shutup
      - shut it
      - shut your mouth
      - shit
      - bullshit
      - ass
      - asshole
      - bastard
      - bitch
      - fuck
      - fucker
      - fucking
      - wtf
      - stfu
      - screw you
      - piss off
      - dick
      - prick

  threats_and_violence:
    score: 5
    words:
      - i will kill you
      - kill you
      - beat you
      - hurt you
      - destroy you
      - smash you
      - punch you
      - slap you
      - break your face
      - break your bones
      - come fight
      - fight me
      - watch your back
      - you are dead
      - dead man
      - go die
      - kys

  hinglish:
    score: 3
    words:
      - chup
      - chup kar
      - bakwas
      - faltu
      - pagal
      - bewakoof
      - nalayak
      - chutiya
      - bc
      - bkl
      - gandu
      - harami
      - saale
      - kameena

  # Catches intentional obfuscation like f*u*c*k, sh!t, a$$hole
  obfuscation_patterns:
    score: 3
    regexes:
      - 'f+[\W_]*u+[\W_]*c+[\W_]*k+'
      - 's+[\W_]*h+[\W_]*i+[\W_]*t+'
      - 'b+[\W_]*i+[\W_]*t+[\W_]*c+[\W_]*h+'
      - 'a+[\W_]*s+[\W_]*s+[\W_]*h+[\W_]*o+[\W_]*l+[\W_]*e+'
      - 'c+[\W_]*h+[\W_]*u+[\W_]*t+[\W_]*i+[\W_]*y+[\W_]*a+'


# ══════════════════════════════════════════════════════════════
#  GAB FAQ answers
# ══════════════════════════════════════════════════════════════
# The bot answers freelancer questions using the FAQ files in knowledge/current/.
# Qwen uses DASHSCOPE_API_KEY; it receives sanitized questions and bounded approved FAQ context.
# Channels are listed by name (no #) or by ID.

gab_faq:
  enabled: true
  # staging: every reply starts with [TEST BOT]. Change to production at launch.
  environment: staging

  # Alibaba Cloud Model Studio, Qwen3-Omni-Flash, Singapore. No automatic provider fallback.
  # Set search for fully local retrieval without an external model.
  engine: qwen
  model: qwen3-omni-flash

  # Local BM25 searches the entire approved FAQ. Exact matches are rendered locally.
  # A provider failure is never replaced by a semantically "close" answer.
  local_backstop: false  # retained for configuration compatibility; Qwen uses BM25 now
  # Existing FAQ excerpts have explicit approval in entry-policy.yaml. Sanitized questions are
  # sent to Qwen (approved by the project owner, 15 Nov 2026; fields: docs/outbound-payload.md).
  # Earlier thread messages are a separate data category: keep history off unless approved.
  external_questions_approved: true
  external_history_approved: false

  # Used only with engine: search; this embedding model is not the bot's LLM.
  search:
    model: BAAI/bge-small-en-v1.5   # small model that runs inside the bot (downloaded at build time)
    model_dir: models
    keyword_weight: 0.3       # how much exact words count next to meaning
    confident_score: 0.88     # at or above: post the FAQ entry
    min_score: 0.63           # between the two: post the closest entry as "not sure" + flag it
                              # below: "not in the FAQ" + flag it
    role_penalty: 0.1         # entries for the other role (annotator vs QC) rank this much lower
    summary_penalty: 0.15     # checklist entries rank this much lower unless the question asks for a checklist

  max_history_messages: 4
  # One person asking the same question again and again: answered normally up to max_asks - 1
  # times; the ask that reaches max_asks inside window_minutes is flagged to the team (one staff
  # card) instead of answered, and later repeats get a short "already flagged" reply.
  # max_asks: 0 turns this off.
  repeat_limit:
    max_asks: 3
    window_minutes: 60

  # Topic tracker: every message in a GAB channel (the only_in sections below) about one of these
  # topics is collected into ONE staff channel, so the team sees who is asking for what. It reads
  # every message, not only ones that @mention the bot. It never replies and pings nobody. The same
  # person raising the same topic again within window_hours updates their card ("Times raised")
  # instead of posting a new one. Make the channel private (staff only).
  #   throttle    task limit / throttle increase
  #   payment     the person's own pay
  #   reset       environment reset
  #   not_added   "why am I not added to Phase 7", no access to the phase
  #   assessment  assessments, qualification / screening tests
  topic_tracker:
    enabled: true
    # Starts with gab-phase, so Gigi also answers @mentions there (only_in: gab-phase*); the
    # tracker never tracks messages in its own channel.
    channel: gab-phase-staff-requests
    # Optional: send a topic to its own channel instead, e.g. payment: gab-payment-requests
    channels: {}
    topics: [throttle, payment, reset, not_added, assessment]
    # Optional extra words or phrases per topic (case-insensitive, whole words), e.g.
    # assessment: ["quiz"]
    extra_keywords: {}
    window_hours: 24

  model_limits:
    questions_per_day: 20       # per user, rolling 24 hours; persisted across restarts
    questions_per_minute: 3      # shared across that user's channels
    max_prompt_bytes: 8000       # complete serialized UTF-8 request, including history and FAQ
    max_input_tokens: 2000       # planning estimate (bytes / 3); actual provider usage is logged
    max_output_tokens: 300       # the JSON reply: explanation, quotes, general guidance
    retrieval_candidates: 6
    provider_tokens_per_minute: 90000
    provider_queue_capacity: 16
    provider_max_wait_seconds: 3
    provider_max_retries: 2      # per request, on 429/502/503/504 only
    provider_backoff_seconds: 1
    provider_calls_per_question: 3   # all requests one question may cause, retries included
    # Whole-bot cap on Alibaba requests per rolling minute. Alibaba limits the whole account to
    # 60 requests and 100,000 tokens a minute for qwen3-omni-flash (Singapore); a request is about
    # 1,650 tokens, so both limits bind at about 60. Past the cap a question waits up to 10 s, then
    # gets a "busy, ask again in a minute" reply (no staff card, no use of the user's daily
    # allowance). Raise it only after Alibaba raises the account limit.
    provider_requests_per_minute: 50
    max_answer_chars: 6000       # predefined FAQ output; longer guidance escalates
    max_question_chars: 1500
    max_history_message_chars: 400

  discord:
    # Each list takes any number of entries: channel names, category (section) names,
    # "Category/channel" pairs, IDs, or patterns with * (any run of characters). A category means
    # every channel in it; a pattern covers every match, including channels and sections created
    # later (a new phase's "Project GAB P7 ..." sections need no edit). Threads follow their parent
    # channel. Add more lines to add more channels.

    # The server has other projects too: outside these sections the bot ignores everything,
    # @mentions included.
    only_in:
      # Only sections whose name starts with "GAB Phase" (e.g. "GAB Phase 7 Conversation
      # Annotators", "GAB Phase 7 Evaluation"). Older "Project GAB ..." sections are not answered.
      - GAB Phase*
      # Channels whose own name starts with gab-phase (Discord channel names use hyphens, so
      # "GAB Phase*" above doesn't match them), e.g. the staff channel gab-phase-staff-requests.
      - gab-phase*
      - project-gab-queries   # top-level channel (no category) in Deccan AI Community
    # Where the bot answers EVERY new message without being called. Empty: the bot answers only
    # when someone @mentions it (or replies to one of its messages with the ping on) in a GAB
    # channel above. To auto-answer a channel again, add it, e.g.
    # "Project GAB*/project-related-queries".
    answer_channels: []
    # Off: in a DM the bot can't tell which project or role the person is in.
    answer_in_dms: false
    # Which FAQ to use. The two sections have the same channel names, so go by section.
    # A section that matches neither list (e.g. "GAB Phase 7 Evaluation") is answered with role
    # "unknown": entries for annotators and QC rank equally.
    annotator_channels:
      - GAB Phase* Annotator*
    qc_channels:
      - GAB Phase* QC*
    qm_channels: []           # only here does the bot use the internal QM documents
    # Every question the bot can't answer (or isn't sure about) is posted here as a card for the
    # team, with a "Mark as answered" button. Make it a private, staff-only channel.
    unanswered_channel: faq-bot-unanswered
    # Optional: who to tag in the reply when the bot can't answer.
    # "<@USER_ID>" for a person, "<@&ROLE_ID>" for a role. Leave "" to not tag anyone.
    escalation_mention: ""

  # Questions nobody has replied to after after_minutes get a reminder message in Discord
  # asking the team to pick them up (once per question).
  followup:
    after_minutes: 60
    check_every_minutes: 5
    # Two staff channels: new questions the bot couldn't answer go to unanswered_channel
    # (faq-bot-unanswered) at once; questions still unanswered after after_minutes are listed
    # here. Make it private (staff only). If it doesn't exist, reminders go to
    # faq-bot-unanswered instead.
    reminder_channel: faq-bot-followups
    # Who the reminder tags: "<@&ROLE_ID>" for a role (e.g. the GAB support team), "<@USER_ID>"
    # for a person; several separated by spaces. Empty = no one is tagged.
    reminder_mention: ""

  # Who handles what, and the two request forms (/throttle-request, /task-issue).
  # Routing is decided by code from this table (gab_faq/routing.py), never by the AI: when the FAQ
  # can't fully answer, the bot names the contact for that kind of question and tags them on the
  # staff card. The AI can't answer payment questions or act on requests (limits, resets, roles).
  support:
    enabled: true
    contacts:
      task_qc:           {name: "Amtul / Adiba", user_ids: ["1533459501393379488", "1568512803986346028"]}   # task queries and QC
      playground:        {name: "Rachana",       user_ids: ["1152255102778884159"]}   # playground issues
      payment:           {name: "Amtul",         user_ids: ["1533459501393379488"]}   # payment queries
      environment_reset: {name: "Divya Sai",     user_ids: ["1490962186690887823"]}   # environment resets
      # user_ids: Discord user IDs as QUOTED strings (role_ids for roles). The bot builds the
      # mentions (<@id>) in code; empty = name only, no ping. Each person is notified once per card.
    throttle_requests_go_to: task_qc   # /throttle-request and task-limit questions
    task_issues_go_to: task_qc         # /task-issue
    other_questions_go_to: task_qc     # anything that matches no category above
    # Where /throttle-request and /task-issue cards are posted (name or ID); empty = the
    # unanswered-questions channel above. Must be a private, staff-only channel.
    requests_channel: ""
    mention_contacts_in_replies: false # true: also tag the contact in the public reply
    # Public replies never name a staff member: they say "contact <public_contact>". Names above
    # are used only on the private staff cards and in direct messages to the staff.
    public_contact: the admin of this project
    # Payment questions are pointed to this mailbox first.
    payment_email: support@deccanexperts.ai
    request_cooldown_seconds: 60       # per person, per command
    max_attachment_mb: 8               # per screenshot

  slack:
    # Slack uses channel IDs (e.g. C0123ABCD), not names.
    answer_channels: []
    answer_in_dms: true
    annotator_channels: []
    qc_channels: []
    qm_channels: []
    escalation_mention: ""

# Single-server production operating budget. These are validated at startup.
runtime:
  answer_workers: 4
  answer_capacity: 16
  answer_timeout: 45
  user_requests_per_minute: 6
  shutdown_grace: 30
  health_host: 127.0.0.1       # Kubernetes overrides HEALTH_HOST to 0.0.0.0
  health_port: 8080
  export_workers: 2           # also bounds attachment-heavy support submissions
  export_timeout: 120
  export_max_rows: 5000
  export_max_scanned: 20000
  export_max_bytes: 8388608
