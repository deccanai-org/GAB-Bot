# Reviewable policy for the current FAQ. Approval covers these FAQ excerpts only, not new imports or
# incoming user data. Phase 6.x documents moved to knowledge/archive/ on 17 Nov 2026 (Phase 7 start);
# their old policy is in git history.
documents:
  phase7-instructions.md: {external_processing_approved: true}
  phase7-updates.md: {external_processing_approved: true}
  phase7-qc.md: {external_processing_approved: true}
precedence_evidence:
  - "GAB Dual Model Instructions - v7 (Google Doc, IMPORTANT UPDATES dated 15/11/2026, copy taken 17 Nov 2026): Product A 3.5 Flash-Lite; Product B 3.8 Flash-Lite -> Model Underwing; screen recording required; Reset Environment between Model A and Model B. GAB Instructions - Production - v7.1.pdf (17 Nov 2026) has the same text and the same exporter script (v2.0.0); its instruction pages are in knowledge/source-snapshots/gab-instructions-production-v7.1.txt. These supersede the Phase 6.2 rules (Model A only, no reset, no recording), which are archived."
  - "GAB Phase 7 #announcements (16-17 Nov 2026): screen recording mandatory for 7.1; debug JSON mandatory for both products; Product A 3.5 Flash-Lite Thinking level HIGH; latency rules and form; prompting rules; QC thinking-level rules (before/after 12:00 PM IST on 17 Nov); screen recording starts from the model selection step and must show the model and Thinking Level (17 Nov, 5:26 PM; supersedes the doc's 'start at the first prompt'); Chat tab only for both products (17 Nov, 6:05 PM). Team answers of 17 Nov (to 22:40 IST): on rework fix both products per the instructions and reset the environment (S26, S27); one rejection doesn't remove a contributor (S28); Phase 7 selection was based on quality (S29); QC: Task-tab-only issue gets rating 2 and reassign, same annotator for thinking-level-only issues with a reset, short recordings penalized and reassigned to another annotator, dummy files to submit a rejection when files are missing (QC6-QC9). Later the same evening: rework tasks expire, so claim them soon (S27); reload when 'No pending tasks' shows, generalist tasks exhausted on 17 Nov (S30); assessment tasks may use an available model when the named one is missing (S31); QC: a debug JSON missing a turn with a complete recording goes back to the same annotator (QC10). Re-read of 10:40-22:40 IST: no eligibility promise for those who skipped 7.1 (S29); generalist annotation tasks exhausted but some QC tasks remain (S30); rejection disputes go to the admin with the allocation ID (S32); Phase 7.2 payout cap of $150 per task per stage, not a flat $150 (S33, Admin announcement 17 Nov 22:26 IST in the 7.2 channels); the 20% increment was only for Phase 6 (S34); QC: one missing artifact with no other issue is added by QC and marked acceptable (QC11). Not used: 16:26 'Model B in the Task tab' and 16:55/17:53 'approve when the model auto-switches' (both superseded by the Chat-tab-only announcement at 18:05 and the 19:33 answer that annotators must verify the settings throughout). Team answers in the Phase 7 #project-related-queries channels are used only where a Deccan team member answered (Admin, Deccan staff); other contributors' replies are not used."
