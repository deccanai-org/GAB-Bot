apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gab-bot-prod
  namespace: gab-bot
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: secretstore-external
    kind: ClusterSecretStore
  target:
    name: gab-bot-prod
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/gab-bot
