apiVersion: apps/v1
kind: Deployment
metadata:
  name: gab-bot-prod
  namespace: gab-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gab-bot-prod
  template:
    metadata:
      labels:
        app: gab-bot-prod
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8080'
        prometheus.io/path: /metrics
    spec:
      containers:
      - name: gab-bot-prod
        image: 874846752452.dkr.ecr.ap-south-1.amazonaws.com/gab-bot-prod:release-required
        command:
        - python
        - bot.py
        volumeMounts:
        - name: secrets
          mountPath: /app/secrets
          readOnly: true
        - name: output
          mountPath: /app/output
        - name: tmp
          mountPath: /tmp
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1536Mi
        ports:
        - name: health
          containerPort: 8080
        env:
        - name: GAB_ENVIRONMENT
          value: production
        - name: HEALTH_HOST
          value: 0.0.0.0
        - name: HEALTH_PORT
          value: '8080'
        startupProbe:
          httpGet:
            path: /health/ready
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: secrets
        secret:
          secretName: gab-bot-prod
      - name: output
        persistentVolumeClaim:
          claimName: gab-bot-output-prod
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
