apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: freelancer-bots-bucketing-dev
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: secretstore-external
    kind: ClusterSecretStore
  target:
    name: freelancer-bots-bucketing-dev
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/freelancer-bots-bucketing