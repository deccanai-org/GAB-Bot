apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gab-bot-dev
  namespace: gab-bot
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: secretstore-external
    kind: ClusterSecretStore
  target:
    name: gab-bot-dev
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev/gab-bot
