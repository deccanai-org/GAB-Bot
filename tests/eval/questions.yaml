# Current Phase 7 retrieval and guard behavior (GAB Dual Model Instructions v7).
# The Phase 6.2 set is kept in phase62-questions.yaml (run it against tests/fixtures/knowledge-phase6).
- id: model-product-a
  role: annotator
  question: Which model do I pick for Product A?
  outcome: [answered]
  must_include: [3.5 Flash-Lite]
  must_not_include: [flash_1p_old_test_arm, Locust]
  critical: true

- id: model-product-b
  role: annotator
  question: Which model is Product B?
  outcome: [answered]
  must_include: [Model Underwing]
  critical: true

- id: model-switching
  role: annotator
  question: The model keeps switching during the conversation, what should I do?
  outcome: [answered]
  must_include: [switch it back]
  critical: true

- id: recording-required
  role: annotator
  question: Is screen recording required in Phase 7?
  outcome: [answered]
  must_include_any: [Screen recording is required, Record the whole interaction]
  must_not_include: [No screen recording is needed]
  critical: true

- id: reset-required
  role: annotator
  question: Do I reset the environment between Model A and Model B?
  outcome: [answered]
  must_include_any: [Reset ID, reset the environment]
  must_not_include: [do not work on any Reset]
  critical: true

- id: reset-steps
  role: annotator
  question: How do I reset the environment after the Model A run?
  outcome: [answered]
  must_include: [Reset ID]

- id: memory-off
  role: annotator
  question: Should model memory be on or off?
  outcome: [answered]
  must_include: [Memory]

- id: workspace
  role: annotator
  question: How do I connect Gemini to Google Workspace?
  outcome: [answered]
  must_include: [Connected Apps]

- id: key-turn
  role: annotator
  question: What is the key turn?
  outcome: [answered]
  must_include: [maximum synthesis]

- id: nudge-limit
  role: annotator
  question: How many times can I nudge the model?
  outcome: [answered]
  must_include: [3]

- id: llm-followups
  role: annotator
  question: Can I use ChatGPT to write my follow-up prompts?
  outcome: [answered]
  must_include_any: [written by you, never with an LLM]

- id: debug-turns
  role: annotator
  question: What must I check in the debug JSON before uploading?
  outcome: [answered]
  must_include: [turn counts]
  critical: true

- id: allow-pasting
  role: annotator
  question: The console won't let me paste the script
  outcome: [answered]
  must_include: [allow pasting]

- id: artefact-format
  role: annotator
  question: In what format do I upload calendar invites and email drafts?
  outcome: [answered]
  must_include: [PDF]

- id: missing-gmail-draft
  role: annotator
  question: The task asked for a Gmail draft but the model did not create it. What do I upload?
  outcome: [answered]
  must_include_any: [no upload is needed, not met]

- id: share-link
  role: annotator
  question: How do I get the public share link of the conversation?
  outcome: [answered]
  must_include: [Share Conversation]

- id: record-mac
  role: annotator
  question: How do I record only the conversation window on a Mac?
  outcome: [answered]
  must_include: [Command + Shift + 5]

- id: record-windows
  role: annotator
  question: How do I screen record a Chrome tab on Windows?
  outcome: [answered]
  must_include: [Clipchamp]

- id: model-b-prompts
  role: annotator
  question: Can I reuse my Model A prompts for Model B?
  outcome: [answered]
  must_include: [own reply]

- id: action-reset
  role: annotator
  question: Please reset my environment for me
  outcome: [needs_human]
  must_include: [can't reset]
  critical: true

- id: action-payment
  role: annotator
  question: Please approve my payment
  outcome: [needs_human]
  must_include_any: [can't make, payment questions]
  critical: true

- id: unrelated
  role: unknown
  question: What is the capital of France?
  outcome: [not_in_faq]
  must_not_include: [3.5 Flash-Lite, Model Underwing]

- id: greeting
  role: unknown
  question: hello
  outcome: [small_talk]

- id: memory-check-prompt
  role: annotator
  question: Should I ask "What have we been working on?" before the seed prompt?
  outcome: [answered]
  must_include_any: [seed prompt]
  critical: false

- id: low-thinking-before-noon
  role: annotator
  question: I submitted a task with Product A on thinking level LOW before the HIGH rule was announced. Will I be penalized?
  outcome: [answered]
  must_include_any: ["12:00 PM IST", not penalized]
  critical: false

- id: qc-spec-doc
  role: qc
  question: I can't open the QC Specification Doc, it says access denied.
  outcome: [answered]
  must_include_any: [Reload, reload]
  critical: false

- id: recording-start-model-selection
  role: annotator
  question: When do I start the screen recording?
  outcome: [answered]
  must_include_any: [model selection]
  must_not_include: [starts at the seed prompt]
  critical: false

- id: chat-tab-only
  role: annotator
  question: Can I use a different tab instead of Chat for Product B?
  outcome: [answered]
  must_include_any: [Chat tab]
  critical: false

- id: rework-both-products
  role: annotator
  question: My task came back for rework because of the thinking level. Do I redo only Model A or both?
  outcome: [answered]
  must_include_any: [both]
  critical: false

- id: qc-task-tab-rating
  role: qc
  question: The annotator did everything right but used the Task tab for Model B. What do I do?
  outcome: [answered]
  must_include_any: [reassign]
  critical: false

- id: no-pending-tasks
  role: annotator
  question: Start New Task says "No pending tasks are available for you". What do I do?
  outcome: [answered]
  must_include_any: [reload, Reload]
  critical: false

- id: qc-debug-missing-turn
  role: qc
  question: The debug JSON is missing a turn, but the recording is complete and the model didn't stop. Do I send it back?
  outcome: [answered]
  must_include_any: [same annotator]
  critical: false

- id: rejected-but-high-in-recording
  role: annotator
  question: My task was rejected for the thinking level, but I selected HIGH and it shows in my recording. What do I do?
  outcome: [answered]
  must_include_any: [allocation ID, allocation id]
  critical: false

- id: qc-one-artifact-missing
  role: qc
  question: Only one artifact file from Model B is missing and there are no other issues. Do I reject?
  outcome: [answered]
  must_include_any: [acceptable]
  critical: false
- id: separate-recordings
  role: annotator
  question: Should I submit one long video covering Model A and Model B, or two separate videos?
  outcome: [answered]
  must_include_any: [separate, Separate]
  critical: false
- id: reset-already-running
  role: annotator
  question: 'The reset fails with "Could not start reset: a reset is already running for this account". What do I do?'
  outcome: [answered]
  must_include_any: [again]
  critical: false
- id: qc-check-gmail-sent
  role: qc
  question: The debug info shows the email was sent and the conversation says "Message sent". Do I need to check the Gmail Sent folder?
  outcome: [answered]
  must_include_any: [Gmail]
  critical: false
