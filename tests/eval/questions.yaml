# --- QC spec ---

- id: spec-verdict-scale
  role: qc
  question: what do annotator verdict scores 1 2 and 3 mean?
  outcome: [answered]
  must_include_any: [FAIL, Fail]
  must_include: [feedback]

- id: spec-corrected-myself
  role: qc
  question: I gave verdict 1 but I fixed the task myself. Should I reassign it?
  outcome: [answered]
  must_include_any: [approve, Approve]

- id: spec-nudges
  role: qc
  question: annotator nudged the model 4 times on the same thing, how do I score that?
  outcome: [answered]
  must_include_any: [Repeated nudges, nudge]

# --- Internal QM documents must stay internal ---

