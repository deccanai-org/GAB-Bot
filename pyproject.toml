[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gab-faq-bot"
version = "6.1.0"
description = "Gigi, the GAB project FAQ assistant for Discord"
requires-python = ">=3.11"
# Runtime dependencies are pinned with hashes in requirements.lock; install those first.
# Install the CLI editable from the repository (`pip install -e .`): it reads config.yaml and
# knowledge/ from the checkout.
dependencies = []

[project.scripts]
gigi = "gab_faq.__main__:main"

[tool.setuptools.packages.find]
include = ["gab_faq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
