name: Verify production candidate
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DISCORD_TOKEN: ""
      DASHSCOPE_API_KEY: ""
      SLACK_BOT_TOKEN: ""
      SLACK_APP_TOKEN: ""
      # Throwaway database for the knowledge-store tests (the full gate fails on skipped tests).
      GAB_TEST_POSTGRES_URL: "postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres"
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea # postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install verified dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock"
      - name: Run unit, model, and retrieval gates
        run: python scripts/verify_release.py --full
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --progress-spinner off
      - name: Build production image
        run: docker build --tag gab-faq:ci .
      - name: Test non-root image with read-only filesystem and offline model
        run: >-
          docker run --rm --read-only --network none
          --tmpfs /tmp:rw,size=256m
          --tmpfs /app/output:rw,uid=10001,gid=10001,size=64m
          --memory 1536m --cpus 1.5
          gab-faq:ci python scripts/smoke_image.py
